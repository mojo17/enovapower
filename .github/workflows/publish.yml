name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  publish:
    # Publish only from GitHub Actions: PyPI Trusted Publishing (OIDC) isn't
    # available on Gitea Actions, which also lacks the v4 artifact backend.
    # On Gitea this condition is false, so the job is skipped (not failed).
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing (OIDC); no token stored
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: pipx run build

      - name: Check metadata
        run: pipx run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Mirror each PyPI release as a GitHub release, built from the annotated
      # tag like ha-enova-power's release.yml: title from the "Release X: ..."
      # subject, notes from the body minus trailers, with the same sdist and
      # wheel PyPI received. Skipped on a manual dispatch from a branch.
      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout replaces the annotated tag object with a
          # lightweight one pointing at the commit; re-fetch it to read the
          # annotation.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          title=$(printf '%s' "$subject" | sed -E 's/^Release ([0-9])/v\1/')
          [ -n "$title" ] || title="$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" \
            | grep -v '^Co-Authored-By:' > "$RUNNER_TEMP/notes.md" || true
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the assets only.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          fi
